name: Bug report
description: Something in ImGen9 doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a character image
        2. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown next to ImGen9 in the top-left corner of the app.
      placeholder: e.g. v0.1.3
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Docker]
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console
      description: Paste the error text. Please don't attach art you don't have the rights to share.
      render: text
