name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:                       # people run it on their own Mac or Windows PC
          - os: macos-latest           # Apple silicon
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    env:
      # The tests never run background removal; this keeps rembg from fetching a model if anything tried.
      PRELOAD_MODEL: "0"
      U2NET_HOME: ${{ github.workspace }}/.no-rembg-models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Translations complete
        run: python -m tools.i18n_check

      - name: Background removal library loads (no model download)
        run: python -c "import core.config; from rembg import new_session; print('rembg ok')"

      - name: run.sh and run.command are valid and executable (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n run.sh && sh -n run.command
          test -x run.sh && test -x run.command

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check static JS
        run: find static/js -name '*.js' -print0 | xargs -0 -n1 node --check
